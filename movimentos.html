<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031214"><title>Plantita • Movimento Diário</title><style>*{box-sizing:border-box}body{margin:0;background:#031214;color:#eefafa;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:3;background:#06191c;border-bottom:1px solid #17474c;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;background:#0b3439;border:1px solid #2d6f75;border-radius:12px;padding:10px 14px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools select{background:#0b2529;color:#fff;border:1px solid #2a6065;border-radius:10px;padding:10px}.updated{color:#91b9bc;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpi{background:#0b2529;border:1px solid #1b4b50;border-radius:16px;padding:15px}.kpi span{display:block;color:#91b9bc;font-size:12px;margin-bottom:7px}.kpi b{font-size:22px}.neg b{color:#ff9d9d}.net b{color:#8ff2c6}.types{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:16px}.type{background:#092125;border:1px solid #17474c;border-radius:14px;padding:12px}.type span{font-size:11px;color:#89afb2;display:block;margin-bottom:5px}.type b{font-size:16px}.tablewrap{overflow:auto;background:#07191c;border:1px solid #17474c;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#0a2226;color:#9fc5c8;font-size:11px;text-align:left;padding:12px;position:sticky;top:0}td{padding:12px;border-top:1px solid #11363a;font-size:12px;vertical-align:top}.money{text-align:right;font-weight:800}.badge{display:inline-block;padding:4px 8px;border:1px solid #2a5e63;border-radius:999px;background:#0d2a2e;font-size:10px}.empty{text-align:center;padding:30px;color:#91b9bc}@media(max-width:760px){.kpis{grid-template-columns:1fr}.types{grid-template-columns:1fr 1fr}.wrap{padding:10px}.top h1{font-size:16px}}</style></head><body><header class="top"><h1>↗ Movimento Diário</h1><a href="./">← Dashboard</a></header><main class="wrap"><div class="tools"><select id="date"></select><span id="updated" class="updated"></span></div><section class="kpis"><div class="kpi"><span>Entradas registradas</span><b id="in">R$ 0,00</b></div><div class="kpi neg"><span>Retiradas</span><b id="out">R$ 0,00</b></div><div class="kpi net"><span>Saldo líquido</span><b id="net">R$ 0,00</b></div></section><section class="types" id="types"></section><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Conferência</th><th style="text-align:right">Valor</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" style="display:none">Nenhum movimento encontrado.</div></div></main><script>const $=s=>document.querySelector(s),fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);let data=[];const order=['PIX','Getnet','Cielo','Mercado Pago','Dinheiro','Outros'];function render(){const day=$('#date').value;const rows=data.filter(x=>x.data===day);const incoming=rows.filter(x=>x.tipo!=='Retiradas').reduce((s,x)=>s+x.valor,0);const outgoing=rows.filter(x=>x.tipo==='Retiradas').reduce((s,x)=>s+x.valor,0);$('#in').textContent=fmt(incoming);$('#out').textContent=fmt(outgoing);$('#net').textContent=fmt(incoming-outgoing);$('#types').innerHTML=order.map(t=>`<div class="type"><span>${t}</span><b>${fmt(rows.filter(x=>x.tipo===t).reduce((s,x)=>s+x.valor,0))}</b></div>`).join('');$('#body').innerHTML=rows.map(x=>`<tr><td><span class="badge">${x.tipo}</span></td><td>${x.descricao||'—'}</td><td>${x.conferencia||'—'}</td><td class="money">${x.tipo==='Retiradas'?'- ':''}${fmt(x.valor)}</td></tr>`).join('');$('#empty').style.display=rows.length?'none':'block'}fetch('data/movimentos-diarios.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{data=j.movimentos||[];$('#updated').textContent='Base atualizada até '+(j.atualizadoEm||'');const dates=[...new Set(data.map(x=>x.data))].sort((a,b)=>b.split('/').reverse().join('').localeCompare(a.split('/').reverse().join('')));$('#date').innerHTML=dates.map(x=>`<option value="${x}">${x}</option>`).join('');if(dates.length)$('#date').value=dates[0];$('#date').onchange=render;render()}).catch(()=>{$('#empty').style.display='block';$('#empty').textContent='Não foi possível carregar os movimentos.'});</script></body></html>
