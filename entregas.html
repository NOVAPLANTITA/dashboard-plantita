<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Comandas de Entrega</title><style>*{box-sizing:border-box}body{margin:0;background:#031214;color:#eefafa;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:3;background:#06191c;border-bottom:1px solid #17474c;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;background:#0b3439;border:1px solid #2d6f75;border-radius:12px;padding:10px 14px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools select,.tools input{background:#0b2529;color:#fff;border:1px solid #2a6065;border-radius:10px;padding:10px}.updated{font-size:12px;color:#91b9bc;align-self:center}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:#0b2529;border:1px solid #1b4b50;border-radius:16px;padding:15px}.kpi span{display:block;color:#91b9bc;font-size:12px;margin-bottom:7px}.kpi b{font-size:22px}.tablewrap{overflow:auto;background:#07191c;border:1px solid #17474c;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:1050px}th{background:#0a2226;color:#9fc5c8;font-size:11px;text-align:left;padding:12px;position:sticky;top:0}td{padding:12px;border-top:1px solid #11363a;font-size:12px;vertical-align:top}.money{text-align:right;font-weight:800}.badge{display:inline-block;padding:4px 8px;border:1px solid #2a5e63;border-radius:999px;background:#0d2a2e;font-size:10px}.rev{color:#ffd27a}.empty{text-align:center;padding:30px;color:#91b9bc}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:10px}.top h1{font-size:16px}}</style></head><body><header class="top"><h1>🚚 Comandas de Entrega</h1><a href="./">← Dashboard</a></header><main class="wrap"><div class="tools"><select id="date"></select><input id="search" placeholder="Buscar cliente, endereço ou produto"><span class="updated" id="updated"></span></div><section class="kpis"><div class="kpi"><span>Comandas</span><b id="n">0</b></div><div class="kpi"><span>Produtos</span><b id="prod">R$ 0,00</b></div><div class="kpi"><span>Taxas de entrega</span><b id="taxa">R$ 0,00</b></div><div class="kpi"><span>Total</span><b id="total">R$ 0,00</b></div></section><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Endereço</th><th>Pedido</th><th>Pagamento</th><th>Prazo</th><th>Conferência</th><th style="text-align:right">Total</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" style="display:none">Nenhuma comanda encontrada.</div></div></main><script>const $=s=>document.querySelector(s),fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);let data=[];function render(){const day=$('#date').value,q=$('#search').value.toLowerCase().trim();let rows=data.filter(x=>(day==='TODAS'||x.data===day)&&(!q||[x.cliente,x.endereco,x.descricao,x.telefone].join(' ').toLowerCase().includes(q)));$('#n').textContent=rows.length;$('#prod').textContent=fmt(rows.reduce((s,x)=>s+x.valorProduto,0));$('#taxa').textContent=fmt(rows.reduce((s,x)=>s+x.taxaEntrega,0));$('#total').textContent=fmt(rows.reduce((s,x)=>s+x.total,0));$('#body').innerHTML=rows.map(x=>`<tr><td><b>${x.cliente}</b></td><td>${x.telefone||'—'}</td><td>${x.endereco||'—'}</td><td>${x.descricao}</td><td><span class="badge">${x.pagamento}</span></td><td>${x.prazo||'—'}</td><td class="${x.conferencia==='OK'?'':'rev'}">${x.conferencia}</td><td class="money">${fmt(x.total)}</td></tr>`).join('');$('#empty').style.display=rows.length?'none':'block'}fetch('data/comandas-entrega.json?v=20260905-1505',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j.comandas||[];$('#updated').textContent='Base atualizada em '+(j.atualizadoEm||'—');const dates=[...new Set(data.map(x=>x.data))].sort((a,b)=>b.split('/').reverse().join('').localeCompare(a.split('/').reverse().join('')));$('#date').innerHTML='<option value="TODAS">Todas as datas</option>'+dates.map(x=>`<option value="${x}">${x}</option>`).join('');if(dates.length)$('#date').value=dates[0];$('#date').onchange=render;$('#search').oninput=render;render()}).catch(()=>{$('#empty').style.display='block';$('#empty').textContent='Não foi possível carregar as comandas.'});</script></body></html>
