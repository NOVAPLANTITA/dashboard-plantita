<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#596a50"><title>Plantita — Análise de Preços</title><style>:root{--bg:#f4f3ee;--panel:#fff;--ink:#20251f;--muted:#6f766d;--brand:#596a50;--soft:#e7ece3;--line:#dde1da;--warn:#b77a26;--ok:#4d7a54;--danger:#b8483e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--brand);color:white;padding:18px 24px}.top{max-width:1500px;margin:auto}.back{color:white;text-decoration:none;font-weight:800}.title{display:flex;justify-content:space-between;gap:18px;align-items:end}.title h1{margin:12px 0 5px}.title p{margin:0;color:#e8eee5}main{padding:20px;max-width:1500px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin-bottom:16px}.k{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.k span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.k b{font-size:25px;display:block;margin-top:6px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;background:white;border:1px solid var(--line);padding:12px;border-radius:14px}input,select,button{padding:10px;border:1px solid #ccd2c8;border-radius:9px;background:white}input{min-width:260px;flex:1}button{background:var(--brand);color:white;border:0;font-weight:800;cursor:pointer}.wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:white}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1380px}th,td{padding:9px;border-bottom:1px solid #e6e9e3;text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--soft);z-index:2}.money{font-weight:800}.acima{color:#9a5a12;font-weight:800}.abaixo{color:#397347;font-weight:800}.media{color:#555;font-weight:800}.pending{color:#8a5b18;font-weight:800}.status{margin:10px 0 14px;padding:11px 13px;border-radius:10px;background:#fff6e8;color:#7b571e;font-size:13px}.status.ok{background:#e9f4ea;color:#35623d}.muted{color:var(--muted)}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}main{padding:12px}.title{display:block}}</style></head><body><header><div class="top"><a class="back" href="./">← Dashboard Plantita</a><div class="title"><div><h1>Análise de Preços e Margens</h1><p>Custo • venda • markup • lucro • margem • comparação de mercado</p></div><div>Publicação 04/09/2026</div></div></div></header><main><div id="status" class="status">Carregando análise publicada...</div><div class="kpis" id="kpis"></div><div class="bar"><input id="q" placeholder="Pesquisar produto ou marca..."><select id="brand"><option value="">Todas as marcas</option></select><select id="pos"><option value="">Todas as posições</option><option>ACIMA</option><option>NA MÉDIA</option><option>ABAIXO</option><option>PESQUISA AINDA PENDENTE</option><option>SEM COTAÇÃO CONFIÁVEL</option><option>SEM PREÇO DE VENDA</option></select><button id="csv">⬇ CSV</button></div><div class="wrap"><table><thead><tr><th>Marca</th><th>Produto</th><th>Custo</th><th>Venda</th><th>Markup</th><th>Lucro</th><th>Margem</th><th>Mercado</th><th>Dif. R$</th><th>Dif. %</th><th>Posição</th><th>Preço-alvo</th><th>Fonte / referência</th></tr></thead><tbody id="tb"></tbody></table></div><div class="muted" id="count" style="margin-top:8px"></div></main><script>
const FILES=['data/premier-1.json','data/premier-2.json','data/vetminas-1.json','data/ibiuna-1.json','data/safra-mil-1.json','data/nutripassaros-1.json','data/elanco-ollea-1.json','data/tem-tudo-variado-1.json','data/galinhas-1.json','data/expar-1.json','data/3c-digital-pets-1.json','data/tem-tudo-2-1.json'];let D=[];const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),brl=v=>v==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),pct=v=>v==null?'—':new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(v);const obj=r=>({marca:r[0],produto:r[1],custo:r[2],venda:r[3],markup:r[4],lucro:r[5],margem:r[6],mercado:r[7],dif:r[8],difpct:r[9],pos:r[10],alvo:r[11],fonte:r[12]});function filt(){const s=el('q').value.toLowerCase(),b=el('brand').value,p=el('pos').value;return D.filter(x=>(!s||(`${x.marca} ${x.produto}`).toLowerCase().includes(s))&&(!b||x.marca===b)&&(!p||x.pos===p))}function cls(p){return p==='ACIMA'?'acima':p==='ABAIXO'?'abaixo':p==='NA MÉDIA'?'media':'pending'}function render(){const f=filt(),sales=f.filter(x=>x.venda!=null),markets=f.filter(x=>x.mercado!=null),avg=(a,k)=>a.length?a.reduce((s,x)=>s+(x[k]||0),0)/a.length:0;el('kpis').innerHTML=`<div class=k><span>Produtos analisados</span><b>${f.length}</b></div><div class=k><span>Marcas / grupos</span><b>${new Set(f.map(x=>x.marca)).size}</b></div><div class=k><span>Markup médio</span><b>${pct(avg(sales,'markup'))}</b></div><div class=k><span>Margem média</span><b>${pct(avg(sales,'margem'))}</b></div><div class=k><span>Com preço mercado</span><b>${markets.length}</b></div>`;el('tb').innerHTML=f.map(x=>`<tr><td><b>${esc(x.marca)}</b></td><td>${esc(x.produto)}</td><td class=money>${brl(x.custo)}</td><td class=money>${brl(x.venda)}</td><td>${pct(x.markup)}</td><td class=money>${brl(x.lucro)}</td><td>${pct(x.margem)}</td><td class=money>${brl(x.mercado)}</td><td class=money>${brl(x.dif)}</td><td>${pct(x.difpct)}</td><td class="${cls(x.pos)}">${esc(x.pos||'—')}</td><td class=money>${brl(x.alvo)}</td><td>${x.fonte&&/^https?:/.test(x.fonte)?`<a target=_blank rel=noopener href="${esc(x.fonte.split(';')[0])}">referência ↗</a>`:esc(x.fonte||'—')}</td></tr>`).join('');el('count').textContent=`${f.length} produto(s) exibido(s)`}function download(){const f=filt(),v=[['Marca','Produto','Custo','Venda','Markup','Lucro','Margem','Mercado','Dif R$','Dif %','Posição','Preço-alvo'],...f.map(x=>[x.marca,x.produto,x.custo,x.venda,x.markup,x.lucro,x.margem,x.mercado,x.dif,x.difpct,x.pos,x.alvo])],txt='\ufeff'+v.map(r=>r.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='analise_precos_plantita.csv';a.click()}
Promise.all(FILES.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f);return r.json()}))).then(parts=>{D=parts.flat().map(obj);el('brand').innerHTML='<option value="">Todas as marcas</option>'+[...new Set(D.map(x=>x.marca))].sort((a,b)=>a.localeCompare(b,'pt-BR')).map(b=>`<option>${esc(b)}</option>`).join('');el('status').textContent=`✓ ${D.length} produtos publicados no dashboard. Dados carregados do próprio GitHub Pages.`;el('status').className='status ok';render()}).catch(e=>{el('status').textContent='Não foi possível carregar todos os arquivos da análise. Atualize a página em alguns instantes.';console.error(e)});['q','brand','pos'].forEach(id=>el(id).addEventListener(id==='q'?'input':'change',render));el('csv').onclick=download;</script></body></html>
