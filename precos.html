<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plantita — Análise de Preços</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f3ee;color:#20251f}header{background:#596a50;color:white;padding:18px 24px}main{padding:20px;max-width:1500px;margin:auto}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.k{background:white;border-radius:14px;padding:15px}.k b{font-size:26px;display:block;margin-top:6px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{padding:10px;border:1px solid #ccd2c8;border-radius:9px}input{min-width:280px;flex:1}table{width:100%;border-collapse:collapse;background:white;font-size:12px;min-width:1250px}th,td{padding:9px;border-bottom:1px solid #e6e9e3;text-align:left}th{position:sticky;top:0;background:#e7ece3}.wrap{overflow:auto;max-height:72vh;border-radius:12px}.acima{color:#9a5a12;font-weight:bold}.abaixo{color:#397347;font-weight:bold}.media{color:#555;font-weight:bold}a{color:#596a50}.back{color:white;text-decoration:none;font-weight:bold}</style></head><body><header><a class="back" href="./">← Dashboard Plantita</a><h1>Análise de Preços e Margens</h1><div>Custo • venda • markup • lucro • margem • comparação de mercado</div></header><main><div class="kpis" id="kpis"></div><div class="bar"><input id="q" placeholder="Pesquisar produto..."><select id="brand"><option value="">Todas as marcas</option></select><select id="pos"><option value="">Todas posições</option><option>ACIMA</option><option>NA MÉDIA</option><option>ABAIXO</option><option>PESQUISA AINDA PENDENTE</option></select></div><div class="wrap"><table><thead><tr><th>Marca</th><th>Produto</th><th>Custo</th><th>Venda</th><th>Markup</th><th>Lucro</th><th>Margem</th><th>Mercado</th><th>Dif. R$</th><th>Dif. %</th><th>Posição</th><th>Preço-alvo</th><th>Fonte</th></tr></thead><tbody id="tb"></tbody></table></div></main><script>let D=[];const brl=v=>v==null||v===''?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v));const pct=v=>v==null||v===''?'—':new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(Number(v));const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));Promise.all(['premier','vetminas','ibiuna','safra-mil','nutripassaros','elanco-ollea','tem-tudo-variado','galinhas','expar','3c-digital-pets','tem-tudo-2'].map(f=>fetch('data/'+f+'.json',{cache:'no-store'}).then(r=>r.json()))).then(a=>{D=a.flat();const brands=[...new Set(D.map(x=>x.marca))].sort();brand.innerHTML+=[...brands].map(b=>`<option>${esc(b)}</option>`).join('');render()});function render(){let f=D.filter(x=>(!brand.value||x.marca===brand.value)&&(!pos.value||x.posicao===pos.value)&&(!q.value||(`${x.produto} ${x.marca}`).toLowerCase().includes(q.value.toLowerCase())));const withM=f.filter(x=>x.mercado!=null);const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;kpis.innerHTML=`<div class=k>Produtos analisados<b>${f.length}</b></div><div class=k>Markup médio<b>${pct(avg(f.filter(x=>x.markup!=null).map(x=>x.markup)))}</b></div><div class=k>Margem média<b>${pct(avg(f.filter(x=>x.margem!=null).map(x=>x.margem)))}</b></div><div class=k>Com preço de mercado<b>${withM.length}</b></div>`;tb.innerHTML=f.map(x=>`<tr><td>${esc(x.marca)}</td><td>${esc(x.produto)}</td><td>${brl(x.custo)}</td><td>${brl(x.venda)}</td><td>${pct(x.markup)}</td><td>${brl(x.lucro)}</td><td>${pct(x.margem)}</td><td>${brl(x.mercado)}</td><td>${brl(x.dif)}</td><td>${pct(x.difpct)}</td><td class="${x.posicao==='ACIMA'?'acima':x.posicao==='ABAIXO'?'abaixo':'media'}">${esc(x.posicao||'—')}</td><td>${brl(x.alvo)}</td><td>${x.fonte?`<a href="${esc(x.fonte.split(';')[0])}" target=_blank>referência</a>`:'—'}</td></tr>`).join('')}q.oninput=render;brand.onchange=render;pos.onchange=render;</script></body></html>
