<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#031214}.actions{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:2147483647;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 20px)}.action{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 13px;border-radius:13px;text-decoration:none;color:#fff;font:800 11px Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}.mov{background:#0b3439}.ent{background:#16724f}.fin{background:#0b5b68}.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#fff;color:#0b5e42;font-size:12px;font-weight:900}@media(max-width:760px){.actions{left:7px;right:7px;top:max(7px,env(safe-area-inset-top));justify-content:center;gap:5px}.action{min-height:38px;padding:0 9px;font-size:9px;border-radius:11px}.count{min-width:21px;height:21px;font-size:10px}}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260911-1404" title="Dashboard Plantita"></iframe><div class="actions"><a class="action mov" href="movimentos.html?v=20260911-1404" target="_self">🧾 COMANDA DIÁRIA</a><a class="action ent" href="entregas-v2.html?v=20260911-1404" target="_self">🚚 COMANDAS DE ENTREGA <span class="count">74</span></a><a class="action fin" href="financeiro.html?v=20260911-1404" target="_self">📊 FINANCEIRO</a></div><script>const TOTAL_PEDIDOS=74;const frame=document.getElementById('dash');function aplicar(){try{const d=frame.contentDocument;if(!d)return;const nav=d.querySelector('.sidebar .nav');if(nav&&!nav.querySelector('[data-dre]')){const a=d.createElement('a');a.href='dre.html?v=20260911-1404';a.target='_top';a.setAttribute('data-dre','1');a.innerHTML='<svg><use href="#i-file"/></svg>DRE';const fin=[...nav.querySelectorAll('a')].find(x=>(x.textContent||'').trim().toLowerCase()==='financeiro');if(fin&&fin.nextSibling)nav.insertBefore(a,fin.nextSibling);else nav.appendChild(a)}const mob=d.querySelector('.mobile');if(mob&&!mob.querySelector('[data-dre]')){const a=d.createElement('a');a.href='dre.html?v=20260911-1404';a.target='_top';a.setAttribute('data-dre','1');a.innerHTML='<svg><use href="#i-file"/></svg>DRE';mob.appendChild(a)}[...d.querySelectorAll('a')].forEach(a=>{const txt=(a.textContent||'').trim().toLowerCase();if(txt==='vendas'){a.href='vendas.html?v=20260911-1404';a.target='_top'}if(txt==='financeiro'){a.href='financeiro.html?v=20260911-1404';a.target='_top'}if(txt==='dre'){a.href='dre.html?v=20260911-1404';a.target='_top'}});const labels=[...d.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(label){const box=label.parentElement;const value=box&&box.querySelector('.value');const trend=box&&box.querySelector('.trend');if(value)value.textContent=TOTAL_PEDIDOS.toLocaleString('pt-BR');if(trend)trend.textContent='Total de pedidos de entrega';const mini=label.closest('.mini');const icon=mini&&mini.querySelector('.mini-icon');if(icon){icon.style.background='#25D366';icon.style.color='#fff'}}const hero=d.querySelector('.hero');if(hero&&!hero.dataset.ajustado){hero.dataset.ajustado='1';hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260911-1404';img.alt='Plantita Agro e Pet';img.style.cssText='display:block;width:100%;height:auto';hero.appendChild(img);const st=d.createElement('style');st.textContent='.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.layout{padding-top:8px!important}@media(max-width:720px){.mobile{grid-template-columns:repeat(6,1fr)!important}.mobile a{font-size:8px!important;padding:5px 2px!important}}';d.head.appendChild(st)}}catch(e){console.warn(e)}}frame.addEventListener('load',()=>{aplicar();setTimeout(aplicar,250);setTimeout(aplicar,1000)});</script></body></html>
