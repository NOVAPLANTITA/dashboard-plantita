ctor('.value'),trend=box&&box.querySelector('.trend');if(value&&TOTAL_PEDIDOS!==null)value.textContent=TOTAL_PEDIDOS.toLocaleString('pt-BR');if(trend)trend.textContent='Total de pedidos de entrega';const icon=label.closest('.mini')?.querySelector('.mini-icon');if(icon){icon.style.background='#25D366';icon.style.color='#fff'}}const hero=d.querySelector('.hero');if(hero&&!hero.dataset.ajustado){hero.dataset.ajustado='1';hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260921-entregas1';img.alt='Plantita Agro e Pet';img.style.cssText='display:block;width:100%;height:auto';hero.appendChild(img);const st=d.createElement('style');st.textContent='.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}@media(max-width:720px){.mobile{grid-template-columns:repeat(6,1fr)!important}.mobile a{font-size:8px!important;padding:5px 2px!important}}';d.head.appendChild(st)}}catch(e){console.warn(e)}}function key(x){return [x.data||'',x.cliente||'',x.telefone||'',x.endereco||'',Number(x.total||0).toFixed(2)].join('|').toLowerCase()}async function atualizarTotalPedidos(){const sources=['data/comandas-entrega.json','data/comandas-entrega-20260909.json','data/comandas-entrega-20260910.json','data/comandas-entrega-20260911.json','data/comandas-entrega-20260911-extra.json','data/comandas-entrega-20260911-extra2.json','data/comandas-entrega-20260912.json','data/comandas-entrega-20260913.json','data/comandas-entrega-20260914.json','data/comandas-entrega-20260915.json','data/comandas-entrega-20260916.json','data/comandas-entrega-20260917.json','data/comandas-entrega-20260918.json','data/comandas-entrega-20260919.json','data/comandas-entrega-20260920.json','data/comandas-entrega-20260921.json','data/comandas-entrega-20260922.json','data/comandas-entrega-20260923.json','data/comandas-entrega-20260924.json','data/comandas-entrega-20260925.json'];try{const files=await Promise.all(sources.map(u=>fetch(u+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{comandas:[]})));const map=new Map();files.flatMap(f=>f.comandas||[]).forEach(x=>map.set(key(x),x));TOTAL_PEDIDOS=map.size;document.querySelectorAll('.count').forEach(el=>el.textContent=TOTAL_PEDIDOS.toLocaleString('pt-BR'));aplicar()}catch(e){console.warn('Contagem de pedidos não atualizada',e);document.querySelectorAll('.count').forEach(el=>el.textContent='—')}}frame.addEventListener('load',()=>{aplicar();setTimeout(aplicar,250);setTimeout(aplicar,1000)});atualizarTotalPedidos();</script></body></html>
