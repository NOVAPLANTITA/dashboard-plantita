<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plantita • Comandas de Entrega</title><script src="auth.js?v=20260915-auth1"></script><script>PlantitaAuth.require(['supervisor','colaborador']);</script><style>*{box-sizing:border-box}body{background:#031214;color:#eefafa;font-family:Arial;margin:0}header{background:#06191c;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#fff;background:#0b3439;border-radius:10px;padding:10px;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:14px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}select,input{background:#0b2529;color:white;padding:10px;border:1px solid #2a6065;border-radius:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.kpis div{background:#0b2529;border:1px solid #1b4b50;border-radius:12px;padding:12px}.kpis span{display:block;font-size:12px;color:#91b9bc}.kpis b{font-size:20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}td,th{padding:11px;border-bottom:1px solid #17474c;text-align:left;font-size:12px;vertical-align:top}th{background:#0a2226}.review{color:#ffd27a}.updated{color:#91b9bc;font-size:12px}@media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis b{font-size:17px}}</style></head><body><header><h2>🚚 Comandas de Entrega</h2><div><span id="role"></span> <a id="back" href="dashboard-v13.html?v=20260918-entregas3">← Dashboard</a> <a href="formacao-preco.html">Formação de Preço</a> <a href="#" onclick="PlantitaAuth.logout();return false">Sair</a></div></header><main class="wrap"><div class="tools"><select id="date"></select><input id="search" placeholder="Buscar cliente, endereço ou produto"><span class="updated" id="updated"></span></div><section class="kpis"><div><span>Comandas</span><b id="n">0</b></div><div><span>Produtos</span><b id="prod">R$ 0,00</b></div><div><span>Taxas de entrega</span><b id="taxa">R$ 0,00</b></div><div><span>Total</span><b id="total">R$ 0,00</b></div></section><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Endereço</th><th>Pedido</th><th>Pagamento</th><th>Prazo</th><th>Conferência</th><th>Total</th></tr></thead><tbody id="body"></tbody></table><p id="empty"></p></div></main><script>const s=PlantitaAuth.session();document.getElementById('role').textContent=(s?.role||'').toUpperCase();if(s?.role==='colaborador')document.getElementById('back').style.display='none';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key=x=>[x.data,x.cliente,x.telefone,x.endereco,Number(x.total||0).toFixed(2)].join('|').toLowerCase();let rows=[];function render(){const d=$('date').value,q=$('search').value.toLowerCase(),r=rows.filter(x=>(d==='TODAS'||x.data===d)&&[x.cliente,x.endereco,x.descricao,x.telefone].join(' ').toLowerCase().includes(q));$('n').textContent=r.length;$('prod').textContent=money(r.reduce((t,x)=>t+Number(x.valorProduto||0),0));$('taxa').textContent=money(r.reduce((t,x)=>t+Number(x.taxaEntrega||0),0));$('total').textContent=money(r.reduce((t,x)=>t+Number(x.total||0),0));$('body').innerHTML=r.map(x=>'<tr><td>'+esc(x.cliente)+'</td><td>'+esc(x.telefone||'—')+'</td><td>'+esc(x.endereco||'—')+'</td><td>'+esc(x.descricao)+'</td><td>'+esc(x.pagamento)+'</td><td>'+esc(x.prazo||'—')+'</td><td class="review">'+esc(x.conferencia)+'</td><td>'+money(x.total)+'</td></tr>').join('');$('empty').textContent=r.length?'':'Nenhuma comanda encontrada.'}const sources=['data/comandas-entrega.json','data/comandas-entrega-20260909.json','data/comandas-entrega-20260910.json','data/comandas-entrega-20260911.json','data/comandas-entrega-20260911-extra.json','data/comandas-entrega-20260911-extra2.json','data/comandas-entrega-20260912.json','data/comandas-entrega-20260913.json','data/comandas-entrega-20260914.json','data/comandas-entrega-20260915.json','data/comandas-entrega-20260916.json','data/comandas-entrega-20260917.json','data/comandas-entrega-20260918.json'];Promise.all(sources.map(u=>fetch(u+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{comandas:[]}))).then(files=>{const m=new Map();files.flatMap(f=>f.comandas||[]).forEach(x=>m.set(key(x),x));rows=[...m.values()];$('updated').textContent='Base atualizada em 18/09/2026 • 10 comandas novas; conferir observações de leitura';const dates=[...new Set(rows.map(x=>x.data))].sort((a,b)=>b.split('/').reverse().join('').localeCompare(a.split('/').reverse().join('')));$('date').innerHTML='<option value="TODAS">Todas as datas</option>'+dates.map(d=>'<option>'+esc(d)+'</option>').join('');$('date').value=dates[0]||'TODAS';$('date').onchange=render;$('search').oninput=render;render()}).catch(()=>{$('empty').textContent='Erro ao carregar comandas.'});</script></body></html>
