<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041517"><title>Plantita • Dashboard</title><style>html,body{margin:0;min-height:100%;background:#031214;color:#fff;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center}.box{text-align:center;padding:28px}.leaf{font-size:46px}.name{font-size:34px;font-weight:900}.sub{color:#48ef9c;margin-top:8px}</style></head><body><div class="loading"><div class="box"><div class="leaf">🌿</div><div class="name">Plantita</div><div class="sub">Carregando dashboard...</div></div></div><script>(async()=>{try{const files=['ui/part1.txt','ui/part2.txt','ui/part3.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text()}));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><div class="leaf">🌿</div><div class="name">Plantita</div><div class="sub">Não foi possível carregar o novo layout.</div></div></div>'}})();</script></body></html>
