<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Plantita • Movimento Diário</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#031214;color:#eefafa;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:3;background:#06191c;border-bottom:1px solid #17474c;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;background:#0b3439;border:1px solid #2d6f75;border-radius:12px;padding:10px 14px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools select,.tools button{background:#0b2529;color:#fff;border:1px solid #2a6065;border-radius:10px;padding:10px}.tools button{cursor:pointer}.updated{color:#91b9bc;font-size:12px;line-height:1.5}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpi{background:#0b2529;border:1px solid #1b4b50;border-radius:16px;padding:15px}.kpi span{display:block;color:#91b9bc;font-size:12px;margin-bottom:7px}.kpi b{font-size:22px}.neg b{color:#ff9d9d}.net b{color:#8ff2c6}.month b{color:#f6d77a}.avg b{color:#9bd8ff}.types{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:16px}.type{background:#092125;border:1px solid #17474c;border-radius:14px;padding:12px}.type span{font-size:11px;color:#89afb2;display:block;margin-bottom:5px}.type b{font-size:16px}.tablewrap{overflow:auto;background:#07191c;border:1px solid #17474c;border-radius:16px}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#0a2226;color:#9fc5c8;font-size:11px;text-align:left;padding:12px;position:sticky;top:0}td{padding:12px;border-top:1px solid #11363a;font-size:12px;vertical-align:top}.money{text-align:right;font-weight:800}.badge{display:inline-block;padding:4px 8px;border:1px solid #2a5e63;border-radius:999px;background:#0d2a2e;font-size:10px}.empty{text-align:center;padding:30px;color:#91b9bc}.warning{display:none;margin:0 0 15px;padding:14px;border-radius:14px;border:1px solid #ad7a2c;background:#3a2a13;color:#ffe4af;line-height:1.5;font-size:13px}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.kpis{grid-template-columns:1fr}.types{grid-template-columns:1fr 1fr}.wrap{padding:10px}.top h1{font-size:16px}}
</style>
</head>
<body><header class="top"><h1>↗ Movimento Diário</h1><a href="dashboard-v13.html?v=20260926-diario26a">← Dashboard</a></header>
<main class="wrap"><div class="tools"><select id="date" aria-label="Selecionar data" disabled><option>Carregando...</option></select><button id="reload" type="button">↻ Atualizar</button><span id="updated" class="updated" role="status">Carregando os registros...</span></div>
<section class="kpis"><div class="kpi"><span>Entradas registradas</span><b id="in">—</b></div><div class="kpi neg"><span>Retiradas</span><b id="out">—</b></div><div class="kpi net"><span>Saldo líquido</span><b id="net">—</b></div><div class="kpi month"><span>Total vendido no mês</span><b id="monthTotal">—</b></div><div class="kpi avg"><span>Média diária de vendas no mês</span><b id="dailyAvg">—</b></div></section>
<div class="warning" id="warning" role="status"></div><section class="types" id="types"></section><div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Descrição</th><th>Conferência</th><th style="text-align:right">Valor</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty">Carregando movimentos...</div></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fontes=['data/movimentos-diarios.json','data/movimentos-07-09-2026.json','data/movimentos-09-09-2026.json','data/movimentos-10-09-2026.json','data/movimentos-11-09-2026.json','data/movimentos-12-09-2026.json','data/movimentos-13-09-2026.json','data/movimentos-14-09-2026.json','data/movimentos-15-09-2026.json','data/movimentos-16-09-2026.json','data/movimentos-17-09-2026.json','data/movimentos-18-09-2026.json','data/movimentos-19-09-2026.json','data/movimentos-20-09-2026.json','data/movimentos-21-09-2026.json','data/movimentos-22-09-2026.json','data/movimentos-23-09-2026.json','data/movimentos-24-09-2026.json','data/movimentos-25-09-2026.json','data/movimentos-26-09-2026.json'];
const order=['PIX','Getnet','Cielo','Mercado Pago','Dinheiro','Outros'];
let data=[],bases=[],falhas=[];
function showWarning(messages){const warning=$('#warning');warning.style.display=messages.length?'block':'none';warning.textContent=messages.join(' ')}
function clearTotals(){['in','out','net','monthTotal','dailyAvg'].forEach(id=>$('#'+id).textContent='—');$('#types').innerHTML='';$('#body').innerHTML=''}
function render(){
 const day=$('#date').value;
 if(!day){clearTotals();$('#empty').style.display='block';$('#empty').textContent='Nenhuma data disponível.';return}
 const rows=data.filter(x=>x.data===day);
 const incoming=rows.filter(x=>x.tipo!=='Retiradas').reduce((s,x)=>s+Number(x.valor||0),0);
 const outgoing=rows.filter(x=>x.tipo==='Retiradas').reduce((s,x)=>s+Number(x.valor||0),0);
 const parts=day.split('/');const monthKey=parts.length===3?parts[1]+'/'+parts[2]:'';
 const monthSales=data.filter(x=>x.tipo!=='Retiradas'&&x.data&&x.data.slice(3)===monthKey);
 const monthTotal=monthSales.reduce((s,x)=>s+Number(x.valor||0),0);
 const salesDays=[...new Set(monthSales.map(x=>x.data))];const dailyAvg=salesDays.length?monthTotal/salesDays.length:0;
 $('#in').textContent=fmt(incoming);$('#out').textContent=fmt(outgoing);$('#net').textContent=fmt(incoming-outgoing);$('#monthTotal').textContent=fmt(monthTotal);$('#dailyAvg').textContent=fmt(dailyAvg);
 $('#types').innerHTML=order.map(t=>`<div class="type"><span>${t}</span><b>${fmt(rows.filter(x=>x.tipo===t).reduce((s,x)=>s+Number(x.valor||0),0))}</b></div>`).join('');
 $('#body').innerHTML=rows.map(x=>`<tr><td><span class="badge">${escapeHtml(x.tipo)}</span></td><td>${escapeHtml(x.descricao||'—')}</td><td>${escapeHtml(x.conferencia||'—')}</td><td class="money">${x.tipo==='Retiradas'?'- ':''}${fmt(x.valor)}</td></tr>`).join('');
 const conferencia=bases.find(b=>Array.isArray(b.movimentos)&&b.movimentos.some(x=>x.data===day)&&typeof b.diferencaConferencia==='number'&&b.diferencaConferencia!==0);
 const warnings=[];
 if(falhas.length)warnings.push('⚠ Carregamento parcial: '+falhas.length+' arquivo(s) não carregado(s) ('+falhas.join(', ')+'). Os totais podem estar incompletos.');
 if(conferencia)warnings.push('⚠ Conferência pendente: total escrito na comanda '+fmt(conferencia.totalInformadoComanda)+'; soma dos lançamentos '+fmt(conferencia.totalLancamentos)+'; diferença '+fmt(Math.abs(conferencia.diferencaConferencia))+'. Verifique os valores antes do fechamento.');
 showWarning(warnings);$('#empty').style.display=rows.length?'none':'block';$('#empty').textContent='Nenhum movimento encontrado para esta data.';
}
async function carregar(){
 $('#reload').disabled=true;$('#date').disabled=true;$('#updated').textContent='Carregando os registros...';$('#empty').style.display='block';$('#empty').textContent='Carregando movimentos...';showWarning([]);
 const anterior=$('#date').value;
 const resultados=await Promise.allSettled(fontes.map(async u=>{const r=await fetch(u+'?v=20260926-diario26a&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j||!Array.isArray(j.movimentos))throw new Error('formato inválido');return j}));
 bases=[];falhas=[];
 resultados.forEach((r,i)=>{if(r.status==='fulfilled')bases.push(r.value);else falhas.push(fontes[i]+' ('+(r.reason?.message||'falha')+')')});
 data=bases.flatMap(b=>b.movimentos).filter(x=>x&&typeof x.data==='string'&&typeof x.tipo==='string'&&Number.isFinite(Number(x.valor)));
 // Correção de YVNA informada por Eric. Também protege contra arquivo antigo em cache.
 data.forEach(x=>{if(x.data==='01/09/2026'&&String(x.tipo).trim().toUpperCase()==='PIX'&&String(x.descricao||'').trim().toUpperCase()==='YVNA'){x.valor=105;x.conferencia='Corrigido por Eric em 21/09/2026: de R$ 405,00 para R$ 105,00';}});
 const dates=[...new Set(data.map(x=>x.data))].sort((a,b)=>b.split('/').reverse().join('').localeCompare(a.split('/').reverse().join('')));
 $('#date').innerHTML=dates.length?dates.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join(''):'<option value="">Sem datas</option>';
 if(dates.length)$('#date').value=dates.includes(anterior)?anterior:dates[0];$('#date').disabled=!dates.length;
 const registro=data.find(x=>x.data==='01/09/2026'&&x.tipo==='PIX'&&String(x.descricao||'').trim().toUpperCase()==='YVNA');
 $('#updated').textContent=(dates.length?'Última data com movimento: '+dates[0]+' • ':'')+'Arquivos carregados: '+bases.length+'/'+fontes.length+' • Base '+(bases[0]?.atualizadoEm||'sem data')+' • PIX YVNA 01/09: '+(registro?fmt(registro.valor):'não localizado');
 if(dates.length)render();else{clearTotals();$('#empty').style.display='block';$('#empty').textContent='Não foi possível carregar os movimentos. Use Atualizar para tentar novamente.';showWarning(falhas.length?['⚠ Falha na leitura das bases: '+falhas.join(', ')]:['Nenhum registro válido encontrado.'])}
 $('#reload').disabled=false;
}
$('#date').addEventListener('change',render);$('#reload').addEventListener('click',carregar);
carregar().catch(e=>{$('#updated').textContent='Erro inesperado: '+e.message;$('#empty').style.display='block';$('#empty').textContent='Erro ao carregar. Toque em Atualizar.';clearTotals();$('#reload').disabled=false});
</script></body></html>
