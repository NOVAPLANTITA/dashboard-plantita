<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#031214}.plantita-actions{position:fixed;right:14px;top:14px;z-index:2147483647;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}.plantita-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.48);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}.mov{background:#0b3439}.ent{background:#16724f}.plantita-label{white-space:nowrap}.count-badge{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:#fff;color:#0b5e42;font-size:12px;font-weight:900;line-height:1}@media(max-width:700px){.plantita-actions{left:8px;right:8px;top:8px;justify-content:center;gap:6px}.plantita-btn{min-height:40px;padding:0 11px;font-size:11px}.plantita-label{white-space:normal;text-align:center;line-height:1.1}.count-badge{min-width:22px;height:22px;font-size:11px}}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260910-1807" title="Dashboard Plantita"></iframe><div class="plantita-actions"><a class="plantita-btn mov" href="movimentos.html?v=20260910-1807"><span class="plantita-label">🧾 COMANDA DIÁRIA</span></a><a class="plantita-btn ent" href="entregas.html?v=20260910-1807"><span class="plantita-label">🚚 COMANDAS DE ENTREGA</span><span class="count-badge" id="deliveryCount">0</span></a></div><script>const f=document.getElementById('dash');let deliveryTotal=null;function ajustarLinks(d){if(!d)return;[...d.querySelectorAll('a')].forEach(a=>{const txt=(a.textContent||'').trim().toLowerCase();if(txt==='vendas'){a.href='vendas.html?v=20260910-1807';a.target='_top';}if(txt==='financeiro'){a.href='financeiro.html?v=20260910-1807';a.target='_top';}});}function applyDeliveryTotal(){try{const d=f.contentDocument;if(!d)return;ajustarLinks(d);if(deliveryTotal===null)return;const labels=[...d.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(label){const box=label.parentElement;const value=box&&box.querySelector('.value');if(value)value.textContent=deliveryTotal.toLocaleString('pt-BR');const trend=box&&box.querySelector('.trend');if(trend)trend.textContent='Total de entregas cadastradas';}}catch(e){console.error(e)}}f.addEventListener('load',()=>{try{const d=f.contentDocument;const hero=d.querySelector('.hero');if(hero){hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260910-1807';img.alt='Plantita Agro e Pet';img.style.cssText='display:block;width:100%;height:auto';hero.appendChild(img);}const st=d.createElement('style');st.textContent='.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.layout{padding-top:8px!important}';d.head.appendChild(st);ajustarLinks(d);applyDeliveryTotal();setTimeout(()=>applyDeliveryTotal(),500);setTimeout(()=>applyDeliveryTotal(),1500);}catch(e){console.error(e)}});function chave(x){return [x.data||'',x.cliente||'',x.telefone||'',x.endereco||'',Number(x.total||0).toFixed(2)].join('|').toLowerCase()}async function carregarEntregas(){try{const urls=['data/comandas-entrega.json','data/comandas-entrega-20260909.json','data/comandas-entrega-20260910.json'];const resp=await Promise.all(urls.map(u=>fetch(u+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{comandas:[]})));const mapa=new Map();resp.flatMap(j=>j.comandas||[]).forEach(x=>mapa.set(chave(x),x));deliveryTotal=mapa.size;document.getElementById('deliveryCount').textContent=deliveryTotal;document.getElementById('deliveryCount').title=deliveryTotal+' pedidos de entrega no total';applyDeliveryTotal();}catch(e){deliveryTotal=null;applyDeliveryTotal()}}carregarEntregas();setInterval(carregarEntregas,60000);</script></body></html>
