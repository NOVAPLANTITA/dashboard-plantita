<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#031214}.plantita-actions{position:fixed;right:14px;top:14px;z-index:2147483647;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}.plantita-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.48);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(8px)}.mov{background:#0b3439}.ent{background:#16724f}.plantita-label{white-space:nowrap}.count-badge{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:#fff;color:#0b5e42;font-size:12px;font-weight:900;line-height:1}@media(max-width:700px){.plantita-actions{left:8px;right:8px;top:8px;justify-content:center;gap:6px}.plantita-btn{min-height:40px;padding:0 11px;font-size:11px}.plantita-label{white-space:normal;text-align:center;line-height:1.1}.count-badge{min-width:22px;height:22px;font-size:11px}}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260907-1315" title="Dashboard Plantita"></iframe><div class="plantita-actions"><a class="plantita-btn mov" href="movimentos.html?v=20260907-1315"><span class="plantita-label">↗ MOVIMENTO DIÁRIO</span></a><a class="plantita-btn ent" href="entregas.html?v=20260907-1315"><span class="plantita-label">🚚 COMANDAS DE ENTREGA</span><span class="count-badge" id="deliveryCount">0</span></a></div><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument;const hero=d.querySelector('.hero');if(hero){hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260907-1315';img.alt='Plantita Agro e Pet';img.style.cssText='display:block;width:100%;height:auto';hero.appendChild(img);}const st=d.createElement('style');st.textContent='.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.layout{padding-top:8px!important}';d.head.appendChild(st);}catch(e){console.error(e)}});fetch('data/comandas-entrega.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{const rows=j.comandas||[];if(!rows.length)return;const dates=[...new Set(rows.map(x=>x.data).filter(Boolean))].sort((a,b)=>b.split('/').reverse().join('').localeCompare(a.split('/').reverse().join('')));const latest=dates[0];const count=rows.filter(x=>x.data===latest).length;document.getElementById('deliveryCount').textContent=count;document.getElementById('deliveryCount').title=count+' pedidos em '+latest;}).catch(()=>{});</script></body></html>
