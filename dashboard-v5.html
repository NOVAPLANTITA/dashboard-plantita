<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0;background:#031214}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260905-1255" title="Dashboard Plantita"></iframe><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;const hero=d.querySelector('.hero');if(hero){hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260905-1255';img.alt='Plantita Agro e Pet';hero.appendChild(img);}const s=d.createElement('style');s.textContent=`.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;background:#06181b!important;border-bottom:1px solid #174d50!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.hero::before,.hero::after{content:none!important;display:none!important}.hero>img{display:block!important;width:100%!important;height:auto!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;object-fit:contain!important;image-rendering:auto!important;transform:none!important}.layout{margin-top:0!important;padding-top:8px!important}.kit-modal{position:fixed;inset:0;z-index:9999;background:#001214cc;display:grid;place-items:center;padding:20px}.kit-card{width:min(420px,92vw);background:#08262b;border:1px solid #1b5b60;border-radius:18px;padding:18px;color:#fff;box-shadow:0 20px 60px #0008}.kit-card h3{margin:0 0 12px}.kit-actions{display:grid;gap:9px}.kit-actions button{border:1px solid #1d646a;background:#0b353b;color:#fff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}.kit-actions button.primary{background:#16d98a;color:#003328;border-color:#16d98a}`;d.head.appendChild(s);const norm=t=>(t||'').replace(/\s+/g,' ').trim();const findText=(txt)=>{const wanted=txt.toLowerCase();return [...d.querySelectorAll('h1,h2,h3,.label,.value,.mini,.panel,.kpi')].find(el=>norm(el.textContent).toLowerCase().includes(wanted));};const go=(txt)=>{const el=findText(txt);if(el){const target=el.closest('.panel,.mini,.kpi')||el;target.scrollIntoView({behavior:'smooth',block:'start'});return true;}return false;};const closeModal=()=>{const m=d.querySelector('.kit-modal');if(m)m.remove();};const configModal=()=>{closeModal();const m=d.createElement('div');m.className='kit-modal';m.innerHTML=`<div class="kit-card"><h3>Configurações</h3><div class="kit-actions"><button class="primary" data-a="refresh">Atualizar dashboard</button><button data-a="prices">Abrir análise de preços</button><button data-a="close">Fechar</button></div></div>`;m.addEventListener('click',e=>{const a=e.target.dataset.a;if(a==='refresh')w.location.reload();if(a==='prices')w.location.href='precos.html';if(a==='close'||e.target===m)closeModal();});d.body.appendChild(m);};const moreModal=()=>{closeModal();const m=d.createElement('div');m.className='kit-modal';m.innerHTML=`<div class="kit-card"><h3>Mais opções</h3><div class="kit-actions"><button class="primary" data-a="prices">Produtos e preços</button><button data-a="report">Relatórios / PDF</button><button data-a="config">Configurações</button><button data-a="close">Fechar</button></div></div>`;m.addEventListener('click',e=>{const a=e.target.dataset.a;if(a==='prices')w.location.href='precos.html';if(a==='report')w.print();if(a==='config'){closeModal();configModal();}if(a==='close'||e.target===m)closeModal();});d.body.appendChild(m);};const activate=(clicked)=>{d.querySelectorAll('.nav a,.mobile a').forEach(a=>a.classList.remove('active'));if(clicked)clicked.classList.add('active');};d.querySelectorAll('.nav a,.mobile a').forEach(a=>{a.addEventListener('click',e=>{const label=norm(a.textContent);const low=label.toLowerCase();if(low.includes('produtos')||low.includes('análise de preços')){e.preventDefault();w.location.href='precos.html';return;}e.preventDefault();activate(a);if(low.includes('visão geral')||low==='início'){w.scrollTo({top:0,behavior:'smooth'});return;}if(low==='vendas'){go('Vendas x Compras');return;}if(low==='compras'){go('Vendas x Compras');return;}if(low==='estoque'){go('Situação do Estoque')||go('Estoque por Marca');return;}if(low==='financeiro'){go('Próximos Vencimentos')||go('Boletos Pagos');return;}if(low==='clientes'){go('Clientes Ativos');return;}if(low==='fornecedores'){go('Próximos Vencimentos');return;}if(low==='relatórios'){w.print();return;}if(low==='configurações'){configModal();return;}if(low==='mais'){moreModal();return;}});});}catch(e){console.error(e)}});</script></body></html>
