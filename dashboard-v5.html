<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0;background:#031214}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260905-1305" title="Dashboard Plantita"></iframe><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument;const w=f.contentWindow;const hero=d.querySelector('.hero');if(hero){hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260905-1305';img.alt='Plantita Agro e Pet';hero.appendChild(img);}const st=d.createElement('style');st.textContent=`.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;background:#06181b!important;border-bottom:1px solid #174d50!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.hero>img{display:block!important;width:100%!important;height:auto!important;margin:0!important;border:0!important}.layout{padding-top:8px!important}.nav a,.mobile a{cursor:pointer!important}.mov-open{display:inline-flex!important;align-items:center;gap:7px}.mov-overlay{position:fixed;inset:0;z-index:99999;background:rgba(1,13,15,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}.mov-overlay.on{display:flex}.mov-modal{width:min(1040px,100%);max-height:92vh;overflow:auto;background:#07191c;border:1px solid #22565b;border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.48);color:#eafafa}.mov-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:20px 22px;background:rgba(7,25,28,.96);border-bottom:1px solid #17474b}.mov-title{font-size:22px;font-weight:800}.mov-sub{font-size:12px;color:#93babc;margin-top:3px}.mov-close{border:1px solid #2c6469;background:#0b2529;color:#fff;border-radius:12px;width:40px;height:40px;font-size:22px;cursor:pointer}.mov-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 22px 2px}.mov-tools label{font-size:12px;color:#93babc}.mov-tools select{background:#0b2529;color:#fff;border:1px solid #2a6065;border-radius:10px;padding:10px 12px;font-weight:700}.mov-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 22px}.mov-kpi{background:#0b2529;border:1px solid #1b4b50;border-radius:16px;padding:15px}.mov-kpi span{display:block;color:#91b9bc;font-size:12px;margin-bottom:7px}.mov-kpi strong{font-size:23px}.mov-kpi.neg strong{color:#ff9d9d}.mov-kpi.net strong{color:#8ff2c6}.mov-types{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;padding:0 22px 16px}.mov-type{background:#092125;border:1px solid #17474c;border-radius:14px;padding:12px}.mov-type span{font-size:11px;color:#89afb2;display:block;margin-bottom:5px}.mov-type b{font-size:16px}.mov-tablewrap{padding:0 22px 22px;overflow:auto}.mov-table{width:100%;border-collapse:collapse;min-width:650px}.mov-table th{position:sticky;top:82px;background:#0a2226;color:#9fc5c8;font-size:11px;text-align:left;padding:11px;border-bottom:1px solid #28585d}.mov-table td{padding:11px;border-bottom:1px solid #11363a;font-size:12px}.mov-table td.v{text-align:right;font-weight:800}.mov-badge{display:inline-block;padding:4px 8px;border:1px solid #2a5e63;border-radius:999px;background:#0d2a2e;font-size:10px;white-space:nowrap}.mov-empty{padding:28px;text-align:center;color:#91b9bc}.mov-float{position:fixed;right:18px;bottom:76px;z-index:9000;border:1px solid #2d6f75;background:#0b3439;color:white;border-radius:999px;padding:12px 16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer}@media(max-width:760px){.mov-overlay{padding:8px}.mov-modal{max-height:96vh;border-radius:18px}.mov-head{padding:16px}.mov-title{font-size:19px}.mov-kpis{grid-template-columns:1fr;padding:12px 16px}.mov-types{grid-template-columns:repeat(2,1fr);padding:0 16px 14px}.mov-tools,.mov-tablewrap{padding-left:16px;padding-right:16px}.mov-float{bottom:82px;right:12px;padding:11px 14px;font-size:12px}.mov-table th{top:73px}}`;d.head.appendChild(st);const norm=t=>(t||'').replace(/\s+/g,' ').trim().toLowerCase();const byText=(text)=>[...d.querySelectorAll('.panel,.mini,.kpi')].find(el=>norm(el.textContent).includes(norm(text)));const ids=[['Vendas x Compras','sec-vendas'],['Situação do Estoque','sec-estoque'],['Estoque por Marca','sec-estoque2'],['Próximos Vencimentos','sec-financeiro'],['Boletos Pagos','sec-financeiro2'],['Clientes Ativos','sec-clientes']];ids.forEach(([txt,id])=>{const el=byText(txt);if(el)el.id=id;});const map={'visão geral':'#topo','vendas':'#sec-vendas','compras':'#sec-vendas','estoque':'#sec-estoque','financeiro':'#sec-financeiro','clientes':'#sec-clientes','fornecedores':'#sec-financeiro','relatórios':'javascript:window.print()','configurações':'javascript:location.reload()','início':'#topo','mais':'precos.html'};const app=d.querySelector('.app');if(app)app.id='topo';d.querySelectorAll('.nav a,.mobile a').forEach(a=>{const label=norm(a.textContent);if(label.includes('produtos')||label.includes('análise de preços')){a.setAttribute('href','precos.html');a.setAttribute('target','_top');return;}for(const [key,href] of Object.entries(map)){if(label===key||label.includes(key)){a.setAttribute('href',href);if(href==='precos.html')a.setAttribute('target','_top');break;}}});const overlay=d.createElement('div');overlay.className='mov-overlay';overlay.innerHTML=`<section class="mov-modal" role="dialog" aria-modal="true" aria-label="Movimento Diário"><div class="mov-head"><div><div class="mov-title">Movimento Diário</div><div class="mov-sub">Entradas, retiradas e detalhes das comandas</div></div><button class="mov-close" aria-label="Fechar">×</button></div><div class="mov-tools"><label for="mov-date">Escolher dia</label><select id="mov-date"></select><span class="mov-sub" id="mov-updated"></span></div><div class="mov-kpis"><div class="mov-kpi"><span>Entradas registradas</span><strong id="mov-in">R$ 0,00</strong></div><div class="mov-kpi neg"><span>Retiradas</span><strong id="mov-out">R$ 0,00</strong></div><div class="mov-kpi net"><span>Saldo líquido</span><strong id="mov-net">R$ 0,00</strong></div></div><div class="mov-types" id="mov-types"></div><div class="mov-tablewrap"><table class="mov-table"><thead><tr><th>Tipo</th><th>Descrição</th><th>Conferência</th><th style="text-align:right">Valor</th></tr></thead><tbody id="mov-body"></tbody></table><div class="mov-empty" id="mov-empty" style="display:none">Nenhum movimento registrado nesta data.</div></div></section>`;d.body.appendChild(overlay);const close=()=>overlay.classList.remove('on');overlay.querySelector('.mov-close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);let data=[];const dateSel=overlay.querySelector('#mov-date');const order=['PIX','Getnet','Cielo','Mercado Pago','Dinheiro','Outros'];const render=()=>{const day=dateSel.value;const rows=data.filter(x=>x.data===day);const incoming=rows.filter(x=>x.tipo!=='Retiradas').reduce((s,x)=>s+x.valor,0);const outgoing=rows.filter(x=>x.tipo==='Retiradas').reduce((s,x)=>s+x.valor,0);overlay.querySelector('#mov-in').textContent=fmt(incoming);overlay.querySelector('#mov-out').textContent=fmt(outgoing);overlay.querySelector('#mov-net').textContent=fmt(incoming-outgoing);overlay.querySelector('#mov-types').innerHTML=order.map(t=>`<div class="mov-type"><span>${t}</span><b>${fmt(rows.filter(x=>x.tipo===t).reduce((s,x)=>s+x.valor,0))}</b></div>`).join('');const body=overlay.querySelector('#mov-body');body.innerHTML=rows.map(x=>`<tr><td><span class="mov-badge">${x.tipo}</span></td><td>${x.descricao}</td><td>${x.conferencia||'—'}</td><td class="v">${x.tipo==='Retiradas'?'- ':''}${fmt(x.valor)}</td></tr>`).join('');overlay.querySelector('#mov-empty').style.display=rows.length?'none':'block';};const openMov=()=>{overlay.classList.add('on');render()};const addButtons=()=>{const nav=d.querySelector('.nav');if(nav&&!nav.querySelector('[data-mov]')){const a=d.createElement('a');a.href='#';a.dataset.mov='1';a.className='mov-open';a.textContent='Movimento Diário';a.onclick=e=>{e.preventDefault();openMov()};nav.appendChild(a)}const mobile=d.querySelector('.mobile');if(mobile&&!mobile.querySelector('[data-mov]')){const a=d.createElement('a');a.href='#';a.dataset.mov='1';a.className='mov-open';a.textContent='Movimentos';a.onclick=e=>{e.preventDefault();openMov()};mobile.appendChild(a)}const btn=d.createElement('button');btn.className='mov-float';btn.textContent='↗ Movimento Diário';btn.onclick=openMov;d.body.appendChild(btn)};addButtons();fetch('data/movimentos-diarios.json?v=20260905-1330').then(r=>r.json()).then(j=>{data=j.movimentos||[];overlay.querySelector('#mov-updated').textContent='Base atualizada até '+(j.atualizadoEm||'');const dates=[...new Set(data.map(x=>x.data))].sort((a,b)=>{const pa=a.split('/').reverse().join('');const pb=b.split('/').reverse().join('');return pb.localeCompare(pa)});dateSel.innerHTML=dates.map(x=>`<option value="${x}">${x}</option>`).join('');dateSel.onchange=render;render()}).catch(e=>{console.error('Movimentos:',e);overlay.querySelector('#mov-empty').style.display='block';overlay.querySelector('#mov-empty').textContent='Não foi possível carregar os movimentos.'});}catch(e){console.error('Plantita buttons:',e)}});</script></body></html>
