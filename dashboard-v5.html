<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0;background:#031214}</style></head><body><iframe id="dash" src="dashboard-v4.html?v=20260905-1305" title="Dashboard Plantita"></iframe><script>const f=document.getElementById('dash');f.addEventListener('load',()=>{try{const d=f.contentDocument;const hero=d.querySelector('.hero');if(hero){hero.innerHTML='';const img=d.createElement('img');img.src='assets/hero-v5.jpg?v=20260905-1305';img.alt='Plantita Agro e Pet';hero.appendChild(img);}const st=d.createElement('style');st.textContent=`.hero{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;background:#06181b!important;border-bottom:1px solid #174d50!important;overflow:hidden!important;line-height:0!important;margin:0!important;padding:0!important}.hero>img{display:block!important;width:100%!important;height:auto!important;margin:0!important;border:0!important}.layout{padding-top:8px!important}.nav a,.mobile a{cursor:pointer!important}`;d.head.appendChild(st);const norm=t=>(t||'').replace(/\s+/g,' ').trim().toLowerCase();const byText=(text)=>[...d.querySelectorAll('.panel,.mini,.kpi')].find(el=>norm(el.textContent).includes(norm(text)));const ids=[['Vendas x Compras','sec-vendas'],['Situação do Estoque','sec-estoque'],['Estoque por Marca','sec-estoque2'],['Próximos Vencimentos','sec-financeiro'],['Boletos Pagos','sec-financeiro2'],['Clientes Ativos','sec-clientes']];ids.forEach(([txt,id])=>{const el=byText(txt);if(el)el.id=id;});const map={ 'visão geral':'#topo','vendas':'#sec-vendas','compras':'#sec-vendas','estoque':'#sec-estoque','financeiro':'#sec-financeiro','clientes':'#sec-clientes','fornecedores':'#sec-financeiro','relatórios':'javascript:window.print()','configurações':'javascript:location.reload()','início':'#topo','mais':'precos.html' };const app=d.querySelector('.app');if(app)app.id='topo';d.querySelectorAll('.nav a,.mobile a').forEach(a=>{const label=norm(a.textContent);if(label.includes('produtos')||label.includes('análise de preços')){a.setAttribute('href','precos.html');a.setAttribute('target','_top');return;}for(const [key,href] of Object.entries(map)){if(label===key||label.includes(key)){a.setAttribute('href',href);if(href==='precos.html')a.setAttribute('target','_top');break;}}});}catch(e){console.error('Plantita buttons:',e)}});</script></body></html>
