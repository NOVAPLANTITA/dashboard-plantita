<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plantita • Resumo mensal</title><style>*{box-sizing:border-box}body{margin:0;background:#061b1e;color:#eefaf7;font:14px Arial,sans-serif}.wrap{padding:17px;max-width:1150px;margin:auto}h2{margin:0 0 6px;font-size:20px}.sub{color:#a6c9c6;font-size:12px;line-height:1.5}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}select,button{background:#14383b;color:#fff;border:1px solid #3a7779;border-radius:9px;padding:9px 12px}.panel{display:flex;align-items:center;justify-content:center;gap:35px;background:#0b292d;border:1px solid #20545a;border-radius:15px;padding:18px;margin-top:13px}.donut{flex:0 0 205px;width:205px;height:205px;border-radius:50%;background:conic-gradient(#20d994 0 50%,#4ca9ff 50% 100%);display:grid;place-items:center}.hole{width:65%;height:65%;border-radius:50%;background:#0b292d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:bold}.hole span{font-size:14px}.hole small{color:#a6c9c6;font-size:11px;font-weight:normal;margin-top:5px}.values{display:grid;gap:15px;min-width:0;flex:1;max-width:500px}.metric{display:flex;gap:12px;align-items:flex-start}.dot{width:13px;height:13px;border-radius:50%;margin-top:4px;flex-shrink:0}.metric label{display:block;color:#b3d1ce;font-size:13px;margin-bottom:4px}.metric strong{display:block;font-size:24px;word-break:break-word}.metric small{display:block;color:#a5c4c2;margin-top:3px}.status{margin-top:12px;color:#f4d3a1;font-size:12px;line-height:1.5}.hint{color:#9dbdb9;font-size:11px;margin-top:9px}@media(max-width:650px){.wrap{padding:12px}.panel{flex-direction:column;gap:16px;padding:16px}.donut{flex-basis:auto;width:170px;height:170px}.values{width:100%;gap:13px}.metric strong{font-size:21px}}</style></head><body><main class="wrap"><div class="top"><div><h2>📊 Resumo mensal da Plantita</h2><div class="sub">Vendas a granel e entregas em um único gráfico</div></div><div><select id="month" aria-label="Selecionar mês"><option value="2026-10">Outubro 2026</option><option value="2026-11">Novembro 2026</option><option value="2026-09">Setembro 2026</option></select> <button id="refresh">↻ Atualizar</button></div></div><section class="panel"><div class="donut"><div class="hole"><span>PLANTITA</span><small>Resumo do mês</small></div></div><div class="values"><div class="metric"><i class="dot" style="background:#20d994"></i><div><label>Vendas a granel</label><strong id="grain">—</strong><small id="grainInfo">Consultando base central</small></div></div><div class="metric"><i class="dot" style="background:#4ca9ff"></i><div><label>Quantidade de entregas</label><strong id="delivery">—</strong><small id="deliveryInfo">Consultando comandas</small></div></div></div></section><div class="status" id="status">Carregando…</div><div class="hint">As duas metades identificam os indicadores; reais e quantidades não são somados nem comparados em porcentagem.</div></main><script>
'use strict';
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),num=n=>Number(n).toLocaleString('pt-BR');
const sources=['data/comandas-entrega.json','data/comandas-entrega-20260909.json','data/comandas-entrega-20260910.json','data/comandas-entrega-20260911.json','data/comandas-entrega-20260911-extra.json','data/comandas-entrega-20260911-extra2.json','data/comandas-entrega-20260912.json','data/comandas-entrega-20260913.json','data/comandas-entrega-20260914.json','data/comandas-entrega-20260915.json','data/comandas-entrega-20260916.json','data/comandas-entrega-20260917.json','data/comandas-entrega-20260918.json','data/comandas-entrega-20260919.json','data/comandas-entrega-20260920.json','data/comandas-entrega-20260921.json','data/comandas-entrega-20260922.json','data/comandas-entrega-20260923.json','data/comandas-entrega-20260924.json','data/comandas-entrega-20260925.json','data/comandas-entrega-20260926.json','data/comandas-entrega-20260928.json','data/comandas-entrega-20260929.json','data/comandas-entrega-20260930.json','data/comandas-entrega-20261001.json','data/comandas-entrega-20261002.json','data/comandas-entrega-20261003.json','data/comandas-entrega-20261005.json','data/comandas-entrega-20261006.json','data/comandas-entrega-20261007.json','data/comandas-entrega-20261008.json','data/comandas-entrega-20261009.json','data/comandas-entrega-20261010.json','data/comandas-entrega-20261011.json','data/comandas-entrega-20261012.json','data/comandas-entrega-20261013.json','data/comandas-entrega-20261014.json','data/comandas-entrega-20261015.json','data/comandas-entrega-20261016.json','data/comandas-entrega-20261017.json','data/comandas-entrega-20261019.json','data/comandas-entrega-20261018.json','data/comandas-entrega-20261020.json','data/comandas-entrega-20261021.json','data/comandas-entrega-20261022.json','data/comandas-entrega-20261023.json','data/comandas-entrega-20261024.json','data/comandas-entrega-20261025.json','data/comandas-entrega-20261026.json','data/comandas-entrega-20261028.json','data/comandas-entrega-20261029.json','data/comandas-entrega-20261030.json','data/comandas-entrega-20261031.json'];
const key=x=>[x.data,x.cliente,x.telefone,x.endereco,Number(x.total||0).toFixed(2)].join('|').toLowerCase();
const monthOf=d=>{const m=String(d||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+'-'+m[2]:''};
let deliveries=[],failed=0,grain=null,grainError='',history=[];
function jsonp(url){return new Promise((resolve,reject)=>{const cb='plantitaResumo_'+Date.now()+'_'+Math.floor(Math.random()*99999),sc=document.createElement('script');let done=false;const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];sc.remove();err?reject(err):resolve(data)};const timer=setTimeout(()=>finish(new Error('Tempo esgotado ao consultar o Google')),18000);window[cb]=d=>finish(null,d);sc.onerror=()=>finish(new Error('Erro ao consultar o Google'));sc.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(sc)})}
function monthKey(v){const t=String(v||'');const iso=t.match(/20\d{2}-\d{2}/);if(iso)return iso[0];const br=t.match(/(\d{2})\/(20\d{2})/);if(br)return br[2]+'-'+br[1];const names=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];const idx=names.findIndex(n=>t.toLowerCase().includes(n));const year=(t.match(/20\d{2}/)||[])[0];return idx>=0&&year?year+'-'+String(idx+1).padStart(2,'0'):''}
async function load(){failed=0;grainError='';$('status').textContent='Atualizando fontes…';const result=await Promise.all([Promise.all(sources.map(async url=>{try{const r=await fetch(url+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.comandas))throw Error('Formato inválido');return j.comandas}catch(e){failed++;return []}})),(async()=>{try{const url=(localStorage.getItem('plantita_granel_dashboard_endpoint_v1')||localStorage.getItem('plantita_granel_sync_endpoint_v1')||'').trim();if(!url)throw Error('Granel sem conexão Google neste navegador; configure na tela Granel.');const d=await jsonp(url);if(!d||d.ok!==true)throw Error(d?.error||'Resposta inválida');grain=d}catch(e){grain=null;grainError=e.message}})(),(async()=>{try{const r=await fetch('data/granel-bipagens-mensal.json?ts='+Date.now(),{cache:'no-store'});const j=await r.json();history=Array.isArray(j.meses)?j.meses:[]}catch(e){history=[]}})()]);const map=new Map();result[0].flat().forEach(x=>map.set(key(x),x));deliveries=[...map.values()];render()}
function render(){const month=$('month').value,ds=deliveries.filter(x=>monthOf(x.data)===month);$('delivery').textContent=num(ds.length);$('deliveryInfo').textContent=money(ds.reduce((n,x)=>n+Number(x.total||0),0))+' em pedidos'+(failed?' • fonte parcial':'');const m=grain?.month||{};const mk=monthKey(m.mes||m.month||m.periodo||m.label||'');const current=new Date().toISOString().slice(0,7);const live=grain&&(mk===month||(!mk&&month===current));const hist=history.find(x=>x.mes===month);if(live){$('grain').textContent=money(Number(m.valor||0));$('grainInfo').textContent=num(Number(m.bipagens||0))+' bipagens • Google';}else{$('grain').textContent=hist?money(Number(hist.valor||0)):'—';$('grainInfo').textContent=hist?'Histórico de bipagens (fechamento '+(hist.ultimaData||'')+')':'Sem valor confirmado para o mês';}const warnings=[];if(!ds.length)warnings.push('Nenhuma entrega registrada nos arquivos para '+month+'. O número 13 exibido no botão da dashboard corresponde ao último dia cadastrado (31/10), não a novembro.');if(failed)warnings.push(failed+' arquivo(s) de entrega não carregaram.');if(!live&&grainError)warnings.push(grainError);if(!live&&!hist)warnings.push('Não há total de granel confirmado para este mês.');$('status').textContent=warnings.length?warnings.join(' • '):'Indicadores carregados. Dados de entregas: arquivos registrados no GitHub.'}
$('month').onchange=render;$('refresh').onclick=load;load();
</script></body></html>
