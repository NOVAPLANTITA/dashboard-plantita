<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0}.actions{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:2147483647;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;border:2px solid rgba(255,255,255,.42);border-radius:14px;padding:12px 15px;font:800 12px Arial,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.58);line-height:1.1;backdrop-filter:blur(8px)}.financeiro{background:#0b5b68;border-color:#76d8e8}.action:active{transform:scale(.98)}@media(max-width:760px){.actions{right:8px;top:max(8px,env(safe-area-inset-top));}.action{text-align:center;padding:12px 10px;font-size:11px;border-radius:12px}}</style></head><body><iframe id="outerDash" src="dashboard-v5.html?v=20260908-1435" title="Dashboard Plantita"></iframe><div class="actions"><a class="action financeiro" href="financeiro.html?v=20260908-1435" target="_self" aria-label="Abrir financeiro e ponto de equilíbrio">📊 FINANCEIRO</a></div><script>let totalPedidos=null;function atualizarCard(doc){if(!doc||totalPedidos===null)return false;try{const labels=[...doc.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(label){const box=label.parentElement;const value=box&&box.querySelector('.value');if(value){value.textContent=totalPedidos.toLocaleString('pt-BR');value.setAttribute('data-entregas-total',String(totalPedidos));}const trend=box&&box.querySelector('.trend');if(trend)trend.textContent='Total de pedidos de entrega';}const links=[...doc.querySelectorAll('a')];links.forEach(a=>{const txt=(a.textContent||'').trim().toLowerCase();if(txt==='vendas'||txt.endsWith('vendas')){a.href='vendas.html?v=20260908-1435';a.target='_top';}if(txt==='financeiro'||txt.endsWith('financeiro')){a.href='financeiro.html?v=20260908-1435';a.target='_top';}});return true;}catch(e){return false}}function procurarNosFrames(win){try{atualizarCard(win.document);for(let i=0;i<win.frames.length;i++)procurarNosFrames(win.frames[i]);}catch(e){}}function forcarAtualizacao(){let tentativas=0;const timer=setInterval(()=>{tentativas++;procurarNosFrames(window);if(tentativas>40)clearInterval(timer);},250);}fetch('data/comandas-entrega.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{totalPedidos=(j.comandas||[]).length;forcarAtualizacao();}).catch(()=>{forcarAtualizacao();});document.getElementById('outerDash').addEventListener('load',forcarAtualizacao);</script></body></html>
