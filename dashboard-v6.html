<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0}.entregas{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:2147483647;text-decoration:none;color:#fff;background:#0f7a57;border:2px solid #8fe3c2;border-radius:14px;padding:13px 16px;font:800 13px Arial,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.58);line-height:1.1}.entregas:active{transform:scale(.98)}@media(max-width:760px){.entregas{left:12px;right:12px;top:max(10px,env(safe-area-inset-top));text-align:center;padding:14px 12px;font-size:13px;border-radius:12px}}</style></head><body><iframe id="outerDash" src="dashboard-v5.html?v=20260907-1405" title="Dashboard Plantita"></iframe><a class="entregas" href="entregas.html?v=20260907-1405" target="_self" aria-label="Abrir comandas de entrega">🚚 COMANDAS DE ENTREGA</a><script>let totalPedidos=null;function atualizarCard(doc){if(!doc||totalPedidos===null)return false;try{const labels=[...doc.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(!label)return false;const box=label.parentElement;const value=box&&box.querySelector('.value');if(value){value.textContent=totalPedidos.toLocaleString('pt-BR');value.setAttribute('data-entregas-total',String(totalPedidos));}const trend=box&&box.querySelector('.trend');if(trend)trend.textContent='Total de pedidos de entrega';return true;}catch(e){return false}}function procurarNosFrames(win){try{if(atualizarCard(win.document))return true;for(let i=0;i<win.frames.length;i++){if(procurarNosFrames(win.frames[i]))return true;}}catch(e){}return false}function forcarAtualizacao(){let tentativas=0;const timer=setInterval(()=>{tentativas++;if(totalPedidos!==null&&procurarNosFrames(window)){clearInterval(timer);}if(tentativas>40)clearInterval(timer);},250);}fetch('data/comandas-entrega.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{totalPedidos=(j.comandas||[]).length;forcarAtualizacao();}).catch(()=>{});document.getElementById('outerDash').addEventListener('load',forcarAtualizacao);</script></body></html>
