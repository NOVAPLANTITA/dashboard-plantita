pendChild(a)}const mob=doc.querySelector('.mobile');if(mob&&!mob.querySelector('[data-dre]')){const a=doc.createElement('a');a.href='dre.html?v=20260909-1140';a.target='_top';a.setAttribute('data-dre','1');a.innerHTML='<svg><use href="#i-file"/></svg>DRE';const fin=[...mob.querySelectorAll('a')].find(x=>(x.textContent||'').trim().toLowerCase()==='financeiro');if(fin&&fin.nextSibling)mob.insertBefore(a,fin.nextSibling);else mob.appendChild(a);const st=doc.createElement('style');st.setAttribute('data-dre-style','1');st.textContent='@media(max-width:720px){.mobile{grid-template-columns:repeat(6,1fr)!important}.mobile a{font-size:8px!important;padding:5px 2px!important}}';doc.head.appendChild(st)}}catch(e){}}function ajustarDashboard(doc){if(!doc)return;try{criarDRE(doc);const labels=[...doc.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(label){const box=label.parentElement;const mini=label.closest('.mini');const icon=mini&&mini.querySelector('.mini-icon');if(icon&&!icon.dataset.whatsappNovo){icon.dataset.whatsappNovo='1';icon.style.background='#25D366';icon.style.color='#fff';icon.style.borderRadius='12px';icon.style.boxShadow='0 0 0 1px rgba(255,255,255,.12) inset';icon.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true" style="width:27px;height:27px"><path d="M16 4.3a11.7 11.7 0 0 0-10.1 17.6L4.3 27.7l5.9-1.5A11.7 11.7 0 1 0 16 4.3Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M11.2 10.4c.5 4.8 3.1 7.6 8.6 10.5l2-2.1-3.2-1.6-1.4 1.2c-2.3-1.2-4-2.9-5.1-5.2l1.1-1.5-2-1.3Z" fill="currentColor"/></svg>';}if(totalPedidos!==null){const value=box&&box.querySelector('.value');if(value)value.textContent=totalPedidos.toLocaleString('pt-BR');const trend=box&&box.querySelector('.trend');if(trend)trend.textContent='Total de pedidos de entrega';}}[...doc.querySelectorAll('a')].forEach(a=>{const txt=(a.textContent||'').trim().toLowerCase();if(txt==='vendas'){a.href='vendas.html?v=20260909-1140';a.target='_top';}if(txt==='financeiro'){a.href='financeiro.html?v=20260909-1140';a.target='_top';}if(txt==='dre'){a.href='dre.html?v=20260909-1140';a.target='_top';}});}catch(e){}}function percorrer(win){try{ajustarDashboard(win.document);for(let i=0;i<win.frames.length;i++)percorrer(win.frames[i]);}catch(e){}}function atualizar(){let n=0;const t=setInterval(()=>{percorrer(window);if(++n>80)clearInterval(t)},200)}async function carregarPedidos(){try{const urls=['data/comandas-entrega.json','data/comandas-entrega-20260909.json'];const resp=await Promise.all(urls.map(u=>fetch(u+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{comandas:[]})));totalPedidos=resp.reduce((s,j)=>s+((j.comandas||[]).length),0);}catch(e){totalPedidos=null;}atualizar()}carregarPedidos();document.getElementById('outerDash').addEventListener('load',atualizar);</script></body></html>
