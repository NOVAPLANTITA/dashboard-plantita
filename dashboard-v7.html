<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Dashboard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031214}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="outer" src="dashboard-v6.html?v=20260911-1300" title="Dashboard Plantita"></iframe><script>let totalPedidos=null;function chave(x){return [x.data||'',x.cliente||'',x.telefone||'',x.endereco||'',Number(x.total||0).toFixed(2)].join('|').toLowerCase()}async function carregar(){try{const urls=['data/comandas-entrega.json','data/comandas-entrega-20260909.json','data/comandas-entrega-20260910.json','data/comandas-entrega-20260911.json','data/comandas-entrega-20260911-extra.json'];const rs=await Promise.all(urls.map(u=>fetch(u+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{comandas:[]})));const mapa=new Map();rs.flatMap(j=>j.comandas||[]).forEach(x=>mapa.set(chave(x),x));totalPedidos=mapa.size;}catch(e){totalPedidos=null;}aplicarTudo()}function aplicarDoc(doc){try{[...doc.querySelectorAll('a')].forEach(a=>{const txt=(a.textContent||'').toLowerCase();const href=(a.getAttribute('href')||'').toLowerCase();if(txt.includes('comandas de entrega')||href.includes('entregas.html')){a.href='entregas-v2.html?v=20260911-1300';a.target='_top';}});if(totalPedidos!==null){const badge=doc.querySelector('#deliveryCount');if(badge)badge.textContent=totalPedidos.toLocaleString('pt-BR');const labels=[...doc.querySelectorAll('.label')];const label=labels.find(el=>(el.textContent||'').toLowerCase().includes('pedidos via whatsapp'));if(label){const box=label.parentElement;const value=box&&box.querySelector('.value');if(value)value.textContent=totalPedidos.toLocaleString('pt-BR');const trend=box&&box.querySelector('.trend');if(trend)trend.textContent='Total de pedidos de entrega';}}}catch(e){}}function percorrer(win){try{aplicarDoc(win.document);for(let i=0;i<win.frames.length;i++)percorrer(win.frames[i]);}catch(e){}}function aplicarTudo(){let n=0;const t=setInterval(()=>{percorrer(window);if(++n>60)clearInterval(t)},250)}document.getElementById('outer').addEventListener('load',()=>{carregar();aplicarTudo()});carregar();setInterval(carregar,60000);</script></body></html>
