<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031214"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Plantita • Acesso</title><script src="auth.js?v=20260925-auth2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#0a493d,#051c20 34%,#031214 76%);color:#eefafa;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#071d22;border:1px solid #1a555d;border-radius:24px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.45)}.brand{font-weight:900;letter-spacing:.14em;color:#20e492;font-size:13px}.card h1{font-size:28px;margin:9px 0 8px}.sub{color:#9bb8b6;font-size:13px;line-height:1.5;margin-bottom:22px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:#bad0cd;font-weight:700}.field input{width:100%;background:#0b2a2f;color:#fff;border:1px solid #285b62;border-radius:13px;padding:14px 15px;font-size:16px;outline:none}.field input:focus{border-color:#23dc91;box-shadow:0 0 0 3px rgba(35,220,145,.12)}button{width:100%;border:0;border-radius:13px;padding:14px 16px;background:linear-gradient(90deg,#18d887,#20e69a);color:#00281f;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px}.msg{min-height:20px;margin-top:13px;font-size:12px;color:#ff858b;text-align:center}.profile{display:none;margin-top:16px;padding:12px;border:1px solid #24525a;border-radius:13px;background:#0a272c;font-size:12px;color:#bcd0cd}.profile b{color:#fff}.profile button{margin-top:10px;background:#0f3940;color:#fff;border:1px solid #32656c}.foot{margin-top:18px;font-size:10px;color:#6f9295;text-align:center}</style></head><body><main class="card"><div class="brand">PLANTITA • DASHBOARD</div><h1>Acesso ao sistema</h1><div class="sub">Entre com seu usuário para abrir a área correspondente ao seu perfil.</div><form id="loginForm"><div class="field"><label for="user">Usuário</label><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="field"><label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required></div><button type="submit">ENTRAR</button><div class="msg" id="msg"></div></form><div class="profile" id="profile"></div><div class="foot">Comercial Nova Plantita</div></main><script>const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),profile=document.getElementById('profile');function mostrarSessao(){const s=PlantitaAuth.session();if(!s)return;form.style.display='none';profile.style.display='block';profile.innerHTML='Sessão ativa como <b>'+s.role.toUpperCase()+'</b><button type="button" id="continue">CONTINUAR</button><button type="button" id="logout">SAIR</button>';document.getElementById('continue').onclick=()=>location.replace(PlantitaAuth.home(s.role));document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.reload()}}mostrarSessao();form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const ok=await PlantitaAuth.login(document.getElementById('user').value,document.getElementById('pass').value);if(!ok){msg.textContent='Usuário ou senha inválidos.';return}const s=PlantitaAuth.session();location.replace(PlantitaAuth.home(s.role))});</script></body></html>
